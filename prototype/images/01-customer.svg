<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880"><rect width="1440" height="880" fill="#f4f7f5"/><g font-family="Segoe UI,Arial,sans-serif" fill="#233e37"><rect width="1440" height="38" fill="#173f38"/><text x="45" y="25" fill="white" font-size="13">VINMED · LAB5 / TRACK 1</text><text x="880" y="25" fill="white" font-size="12">HÌNH MINH HỌA CHÚ THÍCH · KHÔNG PHẢI SCREENSHOT</text><rect y="38" width="1440" height="78" fill="white"/><text x="45" y="87" font-size="29" font-weight="700">✚ VinMed</text><text x="590" y="85" font-size="16" fill="#106b5b">Hỏi dược sĩ</text><text x="780" y="85" font-size="16">Bàn dược sĩ · 1</text><text x="48" y="165" font-size="12" fill="#106b5b" letter-spacing="2">AN TÂM TỪ CÂU HỎI ĐẦU TIÊN</text><text x="48" y="208" font-size="32" font-weight="700">Hiểu đúng trước khi dùng thuốc.</text><text x="48" y="240" font-size="15" fill="#71827e">Sơ đồ định vị các chú thích trong giao diện thật tại prototype/index.html</text><rect x="45" y="280" width="230" height="490" rx="14" fill="#eaf3ec"/><text x="64" y="315" font-size="12" fill="#106b5b">TÌNH HUỐNG THỰC HÀNH</text><text x="64" y="365" font-size="16" font-weight="600">♡ Dấu hiệu nguy hiểm</text><text x="64" y="394" font-size="12">Ưu tiên ngay · không chờ chat</text><text x="64" y="450" font-size="14">Thuốc cho bé 2 tuổi</text><text x="64" y="500" font-size="14">Đau họng thông thường</text><text x="64" y="550" font-size="14">Hỏi tồn kho</text><text x="64" y="600" font-size="14">Sửa thông tin người uống</text><rect x="300" y="280" width="680" height="490" rx="14" fill="white" stroke="#dce7df"/><text x="323" y="318" font-size="16" font-weight="700">Trợ lý Hỏi dược sĩ · AI mô phỏng</text><text x="323" y="345" font-size="12" fill="#71827e">G1 · Năng lực và giới hạn có thể nhận biết ngay</text><rect x="465" y="375" width="488" height="64" rx="12" fill="#106b5b"/><text x="483" y="401" font-size="14" fill="white">Ba mình 70 tuổi đau ngực, khó thở,</text><text x="483" y="424" font-size="14" fill="white">mua giúp thuốc với.</text><rect x="323" y="465" width="628" height="154" rx="12" fill="#fff2ef" stroke="#edc9bd"/><text x="342" y="495" font-size="16" fill="#ab3f3b" font-weight="700">Cần hỗ trợ ngay</text><text x="342" y="525" font-size="14">Hãy tìm hỗ trợ cấp cứu ngay; đừng chờ chat.</text><text x="342" y="552" font-size="14">Không gợi ý thuốc. Dược sĩ có thông báo ưu tiên</text><text x="342" y="579" font-size="14">mô phỏng; không thay thế dịch vụ cấp cứu.</text><rect x="323" y="641" width="335" height="39" rx="7" fill="#ab3f3b"/><text x="340" y="666" font-size="13" fill="white">Tôi hiểu · sẽ tìm hỗ trợ cấp cứu</text><text x="678" y="667" font-size="13" fill="#106b5b">Lưu ghi chú (cần đồng ý)</text><rect x="323" y="704" width="628" height="42" rx="8" fill="#f4f7f5" stroke="#dce7df"/><text x="338" y="731" font-size="13" fill="#71827e">Nhập tình huống giả…</text><rect x="1005" y="280" width="390" height="277" rx="14" fill="white" stroke="#dce7df"/><text x="1024" y="314" font-size="13" fill="#106b5b" font-weight="700">CĂN CỨ ĐANG CÓ</text><text x="1024" y="354" font-size="14">Tin có “đau ngực”, “khó thở”</text><text x="1024" y="390" font-size="14">Người dùng thuốc: 70 tuổi</text><text x="1024" y="423" font-size="14">Thuốc / bệnh nền: chưa rõ</text><text x="1024" y="465" font-size="14" fill="#106b5b">Sửa thông tin người dùng thuốc</text><text x="1024" y="510" font-size="12" fill="#71827e">G10: nêu căn cứ, không bịa % chắc chắn</text><rect x="1005" y="580" width="390" height="190" rx="14" fill="white" stroke="#dce7df"/><text x="1024" y="615" font-size="13" fill="#106b5b" font-weight="700">AI ĐƯỢC LÀM TỚI ĐÂU?</text><text x="1024" y="651" font-size="14">Tự làm: sàng lọc, cảnh báo, chuyển</text><text x="1024" y="685" font-size="14">Cần duyệt: gợi ý và lưu hồ sơ</text><text x="1024" y="719" font-size="14">Cấm: bán kê đơn, tự chỉ liều</text><text x="46" y="824" font-size="14">① G1 · nhãn AI    ② G10 · căn cứ    ③ G9 · sửa    ④ quyền tool    ⑥ consent</text><text x="46" y="851" font-size="12" fill="#71827e">Thay hình minh họa bằng ảnh chụp trình duyệt thực tế trước khi nộp nếu TA yêu cầu screenshot.</text></g><g font-family="Arial" font-size="15" font-weight="700" text-anchor="middle" fill="white"><circle cx="953" cy="308" r="15" fill="#d49b31"/><text x="953" y="313">1</text><circle cx="1360" cy="308" r="15" fill="#d49b31"/><text x="1360" y="313">2</text><circle cx="1360" cy="460" r="15" fill="#d49b31"/><text x="1360" y="465">3</text><circle cx="1360" cy="610" r="15" fill="#d49b31"/><text x="1360" y="615">4</text><circle cx="935" cy="662" r="15" fill="#d49b31"/><text x="935" y="667">6</text></g></svg>
